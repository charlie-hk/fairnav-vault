name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # pinned so results are reproducible; "stable" moves with every release
          version: v1.8.5

      - name: Install dependencies (pinned)
        run: |
          forge install foundry-rs/forge-std@v1.17.0 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git

      - name: Build
        run: forge build --sizes

      - name: Test (unit, fuzz, invariant, deploy)
        run: forge test -vv
